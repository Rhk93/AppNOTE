<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pentagramma Sonoro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Music&family=Nunito:wght@600;800;900&family=Fredoka:wght@500;700&family=Comic+Neue:wght@700&family=Patrick+Hand&family=Roboto:wght@500;900&family=Lora:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdf8ef; --ink:#2b2433; --accent:#e8573c; --accent2:#5865d6; --box:#2b2433; --boxtext:#ffffff;
    --soft:rgba(0,0,0,.07); --blue:#2f6fd6;
    --font:'Nunito',system-ui,sans-serif; --fs:1;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--font);
    display:flex; flex-direction:column; align-items:center;
    padding:18px 12px 12px; min-height:100vh;
    user-select:none; -webkit-user-select:none;
  }
  .top{width:100%;max-width:720px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  h1{margin:0 0 4px;font-size:calc(var(--fs) * clamp(22px,6vw,32px));font-weight:900;letter-spacing:.5px}
  .gear{border:0;background:var(--soft);color:var(--ink);font-size:22px;width:46px;height:46px;border-radius:50%;cursor:pointer;flex:none}
  .sub{margin:0 0 14px;font-size:calc(var(--fs) * 15px);opacity:.7;text-align:center}
  .staff-card{
    width:100%; max-width:720px; background:#fff; border-radius:22px;
    box-shadow:0 6px 0 var(--soft), 0 10px 30px rgba(0,0,0,.08);
    padding:8px 6px; touch-action:none; cursor:pointer;
  }
  svg{display:block;width:100%;height:auto}
  svg text:not(.clef){font-family:var(--font)}
  .clef{font-family:'Noto Music',serif;font-size:80px;fill:#2b2433}
  .result{
    margin-top:14px; width:100%; max-width:420px; min-height:84px;
    background:var(--box); color:var(--boxtext); border-radius:18px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:8px 12px;
  }
  .name{font-size:calc(var(--fs) * clamp(34px,10vw,52px));font-weight:900;line-height:1;transition:transform .15s}
  .name.pop{transform:scale(1.12)}
  .detail{margin-top:4px;font-size:calc(var(--fs) * 14px);opacity:.8;text-align:center}
  .hint{font-size:calc(var(--fs) * 16px);opacity:.7;font-weight:600;text-align:center}
  .cmds{margin-top:14px;width:100%;max-width:720px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .cmds button{font:inherit;font-weight:900;font-size:calc(var(--fs) * 16px);border:0;border-radius:16px;padding:14px 10px;
    background:var(--accent);color:#fff;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25);line-height:1.25}
  .cmds button small{display:block;font-weight:700;font-size:calc(var(--fs) * 13px);opacity:.9}
  .cmds .wide2{background:var(--accent2)}
  .cmds button.on{filter:brightness(.7)}
  .opts{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .opts button{
    font:inherit;font-weight:800;font-size:calc(var(--fs) * 15px);border:0;border-radius:999px;
    padding:10px 16px;background:var(--soft);color:var(--ink);cursor:pointer;
  }
  .opts button.on{background:var(--blue);color:#fff}
  footer{margin-top:auto;padding-top:18px;font-size:12px;opacity:.5}

  /* Pannello Personalizza */
  .veil{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:9}
  .veil.open{display:block}
  .panel{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;background:#fff;color:#2b2433;
    border-radius:22px 22px 0 0;padding:18px 18px 22px;z-index:10;transform:translateY(105%);transition:transform .25s;
    font-family:'Nunito',system-ui,sans-serif;max-height:85vh;overflow:auto}
  .panel.open{transform:none}
  .panel h2{margin:0 0 12px;font-size:20px;font-weight:900}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #eee;font-weight:700;font-size:15px}
  .row input[type=color]{width:52px;height:36px;border:0;padding:0;background:none;border-radius:8px}
  .row select{font:inherit;font-size:15px;padding:6px 8px;border-radius:10px;border:1px solid #ccc;max-width:55%}
  .row input[type=range]{width:55%}
  .themes{display:flex;gap:8px;flex-wrap:wrap;padding:10px 0}
  .themes button{border:2px solid #ddd;border-radius:12px;padding:8px 10px;font:inherit;font-weight:800;font-size:13px;cursor:pointer}
  .pbtns{display:flex;gap:10px;margin-top:14px}
  .pbtns button{flex:1;border:0;border-radius:14px;padding:12px;font:inherit;font-weight:900;font-size:15px;cursor:pointer}
</style>
</head>
<body>
  <div class="top">
    <h1>🎵 Pentagramma Sonoro</h1>
    <button class="gear" id="btnGear" aria-label="Personalizza">⚙️</button>
  </div>
  <p class="sub">Tocca una riga o uno spazio: senti la nota e leggi il suo nome</p>

  <div class="staff-card" id="card">
    <svg id="staff" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <div class="result" id="result">
    <div class="hint">👆 Tocca il pentagramma</div>
  </div>

  <div class="cmds">
    <button id="btnRighi">1 · Note sui righi<small>Mi – Sol – Si – Re – Fa</small></button>
    <button id="btnSpazi">2 · Note negli spazi<small>Fa – La – Do – Mi</small></button>
    <button id="btnSopra" class="wide2">3 · Note sopra il pentagramma<small>Sol – La – Si – Do – Re – Mi</small></button>
    <button id="btnSotto" class="wide2">4 · Note sotto il pentagramma<small>Re – Do – Si – La – Sol – Fa – Mi</small></button>
  </div>

  <div class="opts">
    <button id="btnNames" class="on">Do Re Mi</button>
    <button id="btnSound" class="on">Suono: chitarra</button>
  </div>

  <div class="veil" id="veil"></div>
  <div class="panel" id="panel">
    <h2>🎨 Personalizza</h2>
    <div class="themes" id="themes"></div>
    <div class="row">Colore sfondo <input type="color" data-var="--bg"></div>
    <div class="row">Colore testo <input type="color" data-var="--ink"></div>
    <div class="row">Pulsanti 1 e 2 <input type="color" data-var="--accent"></div>
    <div class="row">Pulsanti 3 e 4 <input type="color" data-var="--accent2"></div>
    <div class="row">Riquadro del nome <input type="color" data-var="--box"></div>
    <div class="row">Testo nel riquadro <input type="color" data-var="--boxtext"></div>
    <div class="row">Carattere
      <select id="selFont">
        <option value="'Nunito',system-ui,sans-serif">Nunito (arrotondato)</option>
        <option value="'Fredoka',system-ui,sans-serif">Fredoka (giocoso)</option>
        <option value="'Comic Neue',cursive">Comic</option>
        <option value="'Patrick Hand',cursive">Scritto a mano</option>
        <option value="'Roboto',system-ui,sans-serif">Roboto (classico)</option>
        <option value="'Lora',Georgia,serif">Lora (con grazie)</option>
      </select>
    </div>
    <div class="row">Dimensione testo <span id="fsVal" style="min-width:42px;text-align:right">100%</span></div>
    <div class="row" style="border:0;padding-top:0"><span>A</span><input type="range" id="rngFs" min="70" max="150" step="5" value="100"><span style="font-size:22px">A</span></div>
    <div class="pbtns">
      <button id="btnReset" style="background:#eee;color:#2b2433">Ripristina</button>
      <button id="btnClose" style="background:#2f6fd6;color:#fff">Fatto</button>
    </div>
  </div>

  <footer>Copyright © Ignazio Paolicelli</footer>

<script>
(function(){
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('staff');
  const resultBox = document.getElementById('result');

  // Geometria: riga inferiore (Mi4) a y=150, passo di 10 per ogni grado
  const BASE_Y = 190, STEP = 10;
  const MIN_I = -7, MAX_I = 14;   // da Mi basso (Mi3) a Mi alto (Mi6)
  const X_NOTE = 250;
  const yOf = i => BASE_Y - i * STEP;

  const IT = ['Do','Re','Mi','Fa','Sol','La','Si'];
  const EN = ['C','D','E','F','G','A','B'];
  const SEMI = [0,2,4,5,7,9,11];
  const COLORS = ['#e8573c','#f29b2e','#e6c229','#4bb366','#2f9fd6','#5865d6','#a35bd1'];

  let useItalian = true, showOct = false, guitar = true;

  function el(tag, attrs, parent){
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    (parent || svg).appendChild(e);
    return e;
  }

  // Disegno pentagramma
  for (let k = 0; k < 5; k++){
    el('line',{x1:14,x2:390,y1:yOf(k*2),y2:yOf(k*2),stroke:'#2b2433','stroke-width':2});
  }
  el('line',{x1:14,x2:14,y1:yOf(8),y2:yOf(0),stroke:'#2b2433','stroke-width':2});
  el('line',{x1:390,x2:390,y1:yOf(8),y2:yOf(0),stroke:'#2b2433','stroke-width':2});
  // Chiave di violino: ricciolo centrato sul 2° rigo (Sol)
  const clef = el('text',{x:24,y:yOf(0)+18,class:'clef'});
  clef.textContent = '\u{1D11E}';
  const CLEF_H = 128;            // altezza della chiave (circa 6 spazi e mezzo)
  function placeClef(){
    try {
      const c = document.createElement('canvas').getContext('2d');
      c.font = '100px "Noto Music"';
      const m = c.measureText('\u{1D11E}');
      const asc = m.actualBoundingBoxAscent, desc = m.actualBoundingBoxDescent;
      if (!(asc + desc > 0)) return;
      const k = CLEF_H / (asc + desc);
      const top = yOf(2) - 0.625 * CLEF_H;   // il 2° rigo cade a circa 5/8 dell'altezza
      clef.style.fontSize = (100 * k) + 'px';
      clef.setAttribute('y', top + asc * k);
    } catch(e) {}
  }
  if (document.fonts && document.fonts.load) {
    document.fonts.load('100px "Noto Music"', '\u{1D11E}').then(placeClef, placeClef);
  } else placeClef();

  // Livelli dinamici
  // Linee "nascoste" del pentagramma (i tagli addizionali sono pezzi di queste linee)
  const hiddenG = el('g',{style:'display:none'});
  [10,12,14,-2,-4,-6].forEach(l => el('line',{x1:14,x2:390,y1:yOf(l),y2:yOf(l),stroke:'#2b2433','stroke-width':1.5,'stroke-dasharray':'5 6',opacity:.3},hiddenG));
  [[14,'linee nascoste'],[-6,'linee nascoste']].forEach(([l,txt]) => {
    const t = el('text',{x:18,y:l>0?yOf(l)-5:yOf(l)+14,'text-anchor':'start','font-size':10,'font-weight':700,fill:'#2b2433',opacity:.45,'font-family':'Nunito,sans-serif'},hiddenG);
    t.textContent = txt;
  });
  const bandG = el('g',{});
  const seqG = el('g',{});
  const ghostG = el('g',{opacity:.25});
  const noteG = el('g',{});

  function drawNote(g, i, color){
    g.innerHTML = '';
    const y = yOf(i);
    // tagli addizionali
    for (let l = -2; l >= i; l -= 2)
      el('line',{x1:X_NOTE-22,x2:X_NOTE+22,y1:yOf(l),y2:yOf(l),stroke:'#2b2433','stroke-width':2},g);
    for (let l = 10; l <= i; l += 2)
      el('line',{x1:X_NOTE-22,x2:X_NOTE+22,y1:yOf(l),y2:yOf(l),stroke:'#2b2433','stroke-width':2},g);
    // gambo
    const up = i < 4;
    if (up) el('line',{x1:X_NOTE+10.5,x2:X_NOTE+10.5,y1:y-2,y2:y-62,stroke:color,'stroke-width':2.6},g);
    else    el('line',{x1:X_NOTE-10.5,x2:X_NOTE-10.5,y1:y+2,y2:y+62,stroke:color,'stroke-width':2.6},g);
    // testa
    el('ellipse',{cx:X_NOTE,cy:y,rx:12,ry:8.6,fill:color,transform:`rotate(-22 ${X_NOTE} ${y})`},g);
  }

  function noteInfo(i){
    const abs = 4*7 + 2 + i;           // Mi4 = indice 0
    const letter = ((abs % 7) + 7) % 7;
    const octave = Math.floor(abs / 7);
    const midi = 12*(octave+1) + SEMI[letter];
    return {letter, octave, midi, freq: 440 * Math.pow(2,(midi-69)/12)};
  }

  // ---------- Audio ----------
  let ctx = null;
  function getCtx(){
    if (!ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
    }
    if (ctx.state === 'suspended') ctx.resume().catch(()=>{});
    return ctx;
  }
  function playGuitar(freq){
    const c = getCtx(); if (!c) return;
    const sr = c.sampleRate, dur = 2.2, len = Math.floor(sr*dur);
    const buf = c.createBuffer(1, len, sr), d = buf.getChannelData(0);
    const N = Math.max(2, Math.round(sr / freq));
    const ring = new Float32Array(N);
    for (let k = 0; k < N; k++) ring[k] = Math.random()*2 - 1;
    let p = 0;
    for (let k = 0; k < len; k++){
      const nx = (p + 1) % N;
      const v = ring[p];
      ring[p] = 0.996 * 0.5 * (ring[p] + ring[nx]);
      d[k] = v * 0.5;
      p = nx;
    }
    const src = c.createBufferSource(); src.buffer = buf;
    const g = c.createGain(); g.gain.value = 0.9;
    src.connect(g).connect(c.destination); src.start();
  }
  function playPiano(freq){
    const c = getCtx(); if (!c) return;
    const t = c.currentTime;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.35,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+1.6);
    g.connect(c.destination);
    [[1,1],[2,0.35],[3,0.12]].forEach(([m,a])=>{
      const o = c.createOscillator(), og = c.createGain();
      o.type = 'triangle'; o.frequency.value = freq*m; og.gain.value = a;
      o.connect(og).connect(g); o.start(t); o.stop(t+1.7);
    });
  }

  // ---------- Interazione ----------
  let lastI = null;
  function iFromEvent(e){
    const pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    let i = Math.round((BASE_Y - p.y) / STEP);
    return Math.max(MIN_I, Math.min(MAX_I, i));
  }

  function show(i, draw){
    const n = noteInfo(i);
    const color = COLORS[n.letter];
    if (draw !== false) drawNote(noteG, i, color);
    const nm = (useItalian ? IT : EN)[n.letter] + (showOct ? n.octave : '');
    const where = (i % 2 === 0) ? 'sulla riga' : 'nello spazio';
    let pos;
    if (i >= 0 && i <= 8) pos = (i % 2 === 0) ? `${i/2+1}ª riga` : `${(i+1)/2}° spazio`;
    else if (i === 9) pos = 'sopra la 5ª riga';
    else if (i === -1) pos = 'sotto la 1ª riga';
    else if (i > 9 && i % 2 === 0) pos = `${(i-8)/2}° taglio sopra · taglio in gola`;
    else if (i > 9) pos = `appoggiata sul ${(i-9)/2}° taglio sopra`;
    else if (i % 2 === 0) pos = `${-i/2}° taglio sotto · taglio in gola`;
    else pos = `sotto il ${(-i-1)/2}° taglio · taglio in testa`;
    resultBox.innerHTML =
      `<div class="name" id="nm" style="color:${color}">${nm}</div>
       <div class="detail">${pos} · ${useItalian ? EN[n.letter] : IT[n.letter]}</div>`;
    const nmEl = document.getElementById('nm');
    requestAnimationFrame(()=>{ nmEl.classList.add('pop'); setTimeout(()=>nmEl.classList.remove('pop'),150); });
    (guitar ? playGuitar : playPiano)(n.freq);
    lastI = i;
  }

  // ---------- Comandi 1 e 2 ----------
  const bR = document.getElementById('btnRighi');
  const bSp = document.getElementById('btnSpazi');
  let seqTimers = [];
  function stopSeq(){
    seqTimers.forEach(clearTimeout); seqTimers = [];
    bandG.innerHTML = ''; seqG.innerHTML = '';
    bR.classList.remove('on'); bSp.classList.remove('on');
  }
  function ledgerList(i){
    const L = [];
    for (let l = -2; l >= i; l -= 2) L.push(l);
    for (let l = 10; l <= i; l += 2) L.push(l);
    return L;
  }
  function runSeq(list, btn){
    stopSeq(); noteG.innerHTML = ''; btn.classList.add('on');
    list.forEach((item, k) => {
      const i = typeof item === 'number' ? item : item.i;
      const x = typeof item === 'number' ? 210 : item.x;
      const lab = typeof item === 'number' ? null : item.lab;
      seqTimers.push(setTimeout(() => {
        seqG.querySelectorAll('.cur').forEach(n => { n.classList.remove('cur'); n.setAttribute('opacity', '.4'); });
        bandG.innerHTML = '';
        const y = yOf(i), n = noteInfo(i), color = COLORS[n.letter];
        const L = ledgerList(i);
        // la linea nascosta si "accende" per tutta la sua lunghezza
        L.forEach(l => el('line',{x1:14,x2:390,y1:yOf(l),y2:yOf(l),stroke:color,'stroke-width':3,opacity:.55},bandG));
        if (L.length === 0 || i % 2 !== 0){
          if (i % 2 === 0) el('rect',{x:14,y:y-4,width:376,height:8,rx:4,fill:color,opacity:.4},bandG);
          else el('rect',{x:14,y:y-9,width:376,height:18,fill:color,opacity:.28},bandG);
        }
        const g = el('g',{class:'cur'},seqG);
        L.forEach(l => el('line',{x1:x-17,x2:x+17,y1:yOf(l),y2:yOf(l),stroke:'#2b2433','stroke-width':2.4},g));
        el('ellipse',{cx:x,cy:y,rx:11,ry:8,fill:'none',stroke:color,'stroke-width':4,transform:`rotate(-22 ${x} ${y})`},g);
        const t = el('text',{x: lab ? x : x+24, y: lab==='up' ? y-16 : lab==='down' ? y+27 : y+6, 'text-anchor': lab ? 'middle' : 'start', fill:color,'font-size':16,'font-weight':900,'font-family':'Nunito,sans-serif'},g);
        t.textContent = (useItalian ? IT : EN)[n.letter];
        show(i, false); lastI = null;
        if (k === list.length - 1) seqTimers.push(setTimeout(() => {
          bandG.innerHTML = '';
          seqG.querySelectorAll('g').forEach(n => n.setAttribute('opacity', '1'));
          seqTimers = [];
          if (btn !== bUp && btn !== bDn) btn.classList.remove('on');
        }, 1000));
      }, k * 800));
    });
  }
  bR.onclick = () => runSeq([0,2,4,6,8], bR);
  bSp.onclick = () => runSeq([1,3,5,7], bSp);

  // ---------- Comando 3: note fuori dal pentagramma ----------
  const bUp = document.getElementById('btnSopra');
  const bDn = document.getElementById('btnSotto');
  let outBtn = null;            // pulsante della modalità "fuori" attiva
  function setOut(btn){
    outBtn = btn;
    hiddenG.style.display = btn ? '' : 'none';
    bUp.classList.toggle('on', btn === bUp);
    bDn.classList.toggle('on', btn === bDn);
  }
  function outClick(btn, items){
    if (outBtn === btn && !seqTimers.length) { setOut(null); stopSeq(); return; }
    setOut(btn);
    runSeq(items, btn);
  }
  // sopra: una accanto all'altra, salendo
  bUp.onclick = () => outClick(bUp, [9,10,11,12,13,14].map((i,k) => ({i, x:105 + k*52, lab:'up'})));
  // sotto: una accanto all'altra, scendendo
  bDn.onclick = () => outClick(bDn, [-1,-2,-3,-4,-5,-6,-7].map((i,k) => ({i, x:98 + k*46, lab:'down'})));

  svg.addEventListener('pointerdown', e => { e.preventDefault(); stopSeq(); show(iFromEvent(e)); });
  svg.addEventListener('pointermove', e => {
    if (e.pointerType === 'mouse') drawNote(ghostG, iFromEvent(e), '#2b2433');
  });
  svg.addEventListener('pointerleave', () => { ghostG.innerHTML = ''; });

  // ---------- Opzioni ----------
  const bN = document.getElementById('btnNames');
  const bS = document.getElementById('btnSound');
  bN.onclick = () => { useItalian = !useItalian; bN.textContent = useItalian ? 'Do Re Mi' : 'C D E'; if (lastI!==null) show(lastI); };
  bS.onclick = () => { guitar = !guitar; bS.textContent = guitar ? 'Suono: chitarra' : 'Suono: pianoforte'; if (lastI!==null) show(lastI); };
  // ---------- Personalizza ----------
  const DEF = {'--bg':'#fdf8ef','--ink':'#2b2433','--accent':'#e8573c','--accent2':'#5865d6','--box':'#2b2433','--boxtext':'#ffffff',
               font:"'Nunito',system-ui,sans-serif", fs:100};
  const THEMES = [
    ['Classico', {}],
    ['Notte', {'--bg':'#1d1b26','--ink':'#f3f0ff','--accent':'#ff7a59','--accent2':'#7c8cff','--box':'#000000','--boxtext':'#ffffff'}],
    ['Mare', {'--bg':'#e8f6fb','--ink':'#0f3b52','--accent':'#1993c4','--accent2':'#12b39a','--box':'#0f3b52','--boxtext':'#ffffff'}],
    ['Prato', {'--bg':'#f0f8e6','--ink':'#2e4a1f','--accent':'#5aa832','--accent2':'#e0a21b','--box':'#2e4a1f','--boxtext':'#ffffff'}],
    ['Caramella', {'--bg':'#fff0f6','--ink':'#5a1f45','--accent':'#ff4f9a','--accent2':'#9b5de5','--box':'#5a1f45','--boxtext':'#ffffff'}],
  ];
  let cfg = Object.assign({}, DEF);
  try { const sv = JSON.parse(localStorage.getItem('pentagramma-cfg') || 'null'); if (sv) cfg = Object.assign(cfg, sv); } catch(e) {}
  const root = document.documentElement.style;
  const colorInputs = document.querySelectorAll('.panel input[type=color]');
  const selFont = document.getElementById('selFont'), rngFs = document.getElementById('rngFs'), fsVal = document.getElementById('fsVal');
  function applyCfg(){
    for (const k in cfg) if (k.startsWith('--')) root.setProperty(k, cfg[k]);
    root.setProperty('--font', cfg.font);
    root.setProperty('--fs', cfg.fs / 100);
    colorInputs.forEach(inp => inp.value = cfg[inp.dataset.var]);
    selFont.value = cfg.font; rngFs.value = cfg.fs; fsVal.textContent = cfg.fs + '%';
    try { localStorage.setItem('pentagramma-cfg', JSON.stringify(cfg)); } catch(e) {}
  }
  colorInputs.forEach(inp => inp.addEventListener('input', () => { cfg[inp.dataset.var] = inp.value; applyCfg(); }));
  selFont.onchange = () => { cfg.font = selFont.value; applyCfg(); };
  rngFs.oninput = () => { cfg.fs = +rngFs.value; applyCfg(); };
  const themesBox = document.getElementById('themes');
  THEMES.forEach(([name, t]) => {
    const full = Object.assign({}, DEF, t);
    const b = document.createElement('button');
    b.textContent = name; b.style.background = full['--bg']; b.style.color = full['--ink']; b.style.borderColor = full['--accent'];
    b.onclick = () => { for (const k in full) if (k.startsWith('--')) cfg[k] = full[k]; applyCfg(); };
    themesBox.appendChild(b);
  });
  const panel = document.getElementById('panel'), veil = document.getElementById('veil');
  const openP = on => { panel.classList.toggle('open', on); veil.classList.toggle('open', on); };
  document.getElementById('btnGear').onclick = () => openP(true);
  document.getElementById('btnClose').onclick = () => openP(false);
  veil.onclick = () => openP(false);
  document.getElementById('btnReset').onclick = () => { cfg = Object.assign({}, DEF); applyCfg(); };
  applyCfg();
})();
</script>
</body>
</html>
